<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen text-slate-100">

    <!-- Landing / Portal Selection Screen -->
    <div id="landingScreen" class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Portal System</h1>
            <p class="text-slate-400">Please select your portal to continue</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl w-full">
            <!-- Agent Card -->
            <div id="agentCardBtn" class="group cursor-pointer bg-slate-800/80 border border-slate-700 p-8 rounded-2xl shadow-xl hover:border-blue-500 hover:bg-slate-800 transition-all duration-300 transform hover:-translate-y-2 text-center">
                <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <h3 class="text-xl font-bold mb-2 text-white">Agent Portal</h3>
                <p class="text-slate-400 text-sm">Access agent workspace.</p>
            </div>

            <!-- Manager Card -->
            <div id="managerCardBtn" class="group cursor-pointer bg-slate-800/80 border border-slate-700 p-8 rounded-2xl shadow-xl hover:border-emerald-500 hover:bg-slate-800 transition-all duration-300 transform hover:-translate-y-2 text-center">
                <div class="w-16 h-16 bg-emerald-600/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-emerald-600 group-hover:text-white transition-all duration-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <h3 class="text-xl font-bold mb-2 text-white">Manager Portal</h3>
                <p class="text-slate-400 text-sm">Access manager administration.</p>
            </div>
        </div>
    </div>

    <!-- Login Form Screen -->
    <div id="loginScreen" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-6 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full relative text-center text-slate-800">
            <button id="backBtn" class="absolute top-4 left-4 text-slate-500 hover:text-slate-800 flex items-center text-sm font-semibold cursor-pointer">
                ← Back
            </button>
            <h2 id="loginTitle" class="text-2xl font-bold text-slate-900 mb-6 mt-2">Login</h2>
            <div id="loginError" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center font-semibold">Invalid Credentials!</div>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">User ID</label>
                    <input type="text" id="loginUser" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900" placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPass" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900" placeholder="Enter password">
                </div>
                <button id="loginSubmitBtn" class="w-full py-2.5 rounded-lg font-semibold text-white transition duration-200 cursor-pointer">Login</button>
            </div>
        </div>
    </div>

    <!-- Agent Dashboard View -->
    <div id="agentApp" class="hidden min-h-screen bg-slate-100 text-slate-800 flex flex-col w-full">
        <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
            <h2 class="text-xl font-bold">Agent Portal Workspace</h2>
            <button class="logoutBtn bg-red-500 text-white px-3 py-1.5 rounded text-xs font-semibold hover:bg-red-600 transition cursor-pointer">Logout</button>
        </header>
        <main class="p-8 text-center flex-grow flex items-center justify-center">
            <h3 class="text-2xl font-semibold text-slate-700">Welcome to Agent Portal!</h3>
        </main>
    </div>

    <!-- Manager Dashboard View -->
    <div id="managerApp" class="hidden min-h-screen bg-slate-100 text-slate-800 flex flex-col w-full">
        <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
            <h2 class="text-xl font-bold">Manager Portal Workspace</h2>
            <button class="logoutBtn bg-red-500 text-white px-3 py-1.5 rounded text-xs font-semibold hover:bg-red-600 transition cursor-pointer">Logout</button>
        </header>
        <main class="p-8 text-center flex-grow flex items-center justify-center">
            <h3 class="text-2xl font-semibold text-slate-700">Welcome to Manager Portal!</h3>
        </main>
    </div>

    <script>
        let activeRole = '';

        document.getElementById('agentCardBtn').addEventListener('click', () => showLogin('agent'));
        document.getElementById('managerCardBtn').addEventListener('click', () => showLogin('manager'));
        document.getElementById('backBtn').addEventListener('click', goBackToLanding);
        document.getElementById('loginSubmitBtn').addEventListener('click', handleLogin);

        document.querySelectorAll('.logoutBtn').forEach(btn => {
            btn.addEventListener('click', logout);
        });

        function showLogin(role) {
            activeRole = role;
            document.getElementById('landingScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').classList.add('hidden');

            const title = document.getElementById('loginTitle');
            const btn = document.getElementById('loginSubmitBtn');

            if (role === 'agent') {
                title.innerText = 'Agent Portal Login';
                btn.className = 'w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition duration-200 cursor-pointer';
            } else {
                title.innerText = 'Manager Portal Login';
                btn.className = 'w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition duration-200 cursor-pointer';
            }
        }

        function goBackToLanding() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('landingScreen').classList.remove('hidden');
        }

        function handleLogin() {
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (activeRole === 'manager') {
                if (userInput === 'manager01' && passInput === 'manager01') {
                    errorDiv.classList.add('hidden');
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('managerApp').classList.remove('hidden');
                } else {
                    errorDiv.innerText = 'Invalid Manager username or password!';
                    errorDiv.classList.remove('hidden');
                }
            } else if (activeRole === 'agent') {
                if (userInput === 'agent01' && passInput === 'agent01') {
                    errorDiv.classList.add('hidden');
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('agentApp').classList.remove('hidden');
                } else {
                    errorDiv.innerText = 'Invalid Agent credentials!';
                    errorDiv.classList.remove('hidden');
                }
            }
        }

        function logout() {
            document.getElementById('agentApp').classList.add('hidden');
            document.getElementById('managerApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('landingScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
