<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management & Portal System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
            <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">System Login</h2>
            
            <div id="loginError" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center"></div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Select Role</label>
                    <select id="loginRole" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="toggleLoginForm()">
                        <option value="agent">Agent Portal</option>
                        <option value="manager">Manager Portal</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="loginUser" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter username">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPass" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter password">
                </div>

                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                    Login
                </button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Application (Hidden by default) -->
    <div id="mainApp" class="hidden min-h-screen">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 id="appTitle" class="text-xl font-bold text-slate-800">Dashboard</h1>
            <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition">Logout</button>
        </header>

        <main class="p-6">
            <div id="agentView" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 class="text-lg font-semibold text-slate-700 mb-4">Agent Order Submission</h3>
                    <!-- Agent Form Content -->
                    <p class="text-slate-600">Welcome to Agent Portal. Here you can place and manage orders.</p>
                </div>
            </div>

            <div id="managerView" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 class="text-lg font-semibold text-slate-700 mb-4">Manager Portal Overview</h3>
                    <!-- Manager Content -->
                    <p class="text-slate-600">Welcome to Manager Portal. Here you can review all system orders and reports.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const credentials = {
            agent: { user: "agentadmin01", pass: "agentadmin01" },
            manager: { user: "manager01", pass: "manager01" }
        };

        function handleLogin() {
            const role = document.getElementById('loginRole').value;
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (userInput === credentials[role].user && passInput === credentials[role].pass) {
                errorDiv.classList.add('hidden');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');

                if (role === 'agent') {
                    document.getElementById('appTitle').innerText = 'Agent Portal';
                    document.getElementById('agentView').classList.remove('hidden');
                    document.getElementById('managerView').classList.add('hidden');
                } else {
                    document.getElementById('managerView').classList.remove('hidden');
                    document.getElementById('agentView').classList.add('hidden');
                    document.getElementById('appTitle').innerText = 'Manager Portal';
                }
            } else {
                errorDiv.innerText = 'Invalid username or password!';
                errorDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
